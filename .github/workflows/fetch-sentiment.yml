name: Fetch Sentiment Data

on:
  schedule:
    # Run weekdays at 22:00 UTC (after US market close, before build-features at 22:30)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: main-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Git LFS
        run: git lfs install

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch sentiment data
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch-sentiment.py
        continue-on-error: true   # don't break the pipeline if sentiment fetch fails

      - name: Commit sentiment data
        run: |
          git config user.name  "Nostradamus Bot"
          git config user.email "bot@nostradamus.app"

          git add data/sentiment/ || true

          if git diff --cached --quiet; then
            echo "No new sentiment data to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "📰 Sentiment data update [${TODAY}]"
            git pull --rebase --autostash origin main
            git push
          fi
