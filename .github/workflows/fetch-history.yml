name: Nightly Historical Data Fetch

on:
  schedule:
    # Weekdays at 9:30 PM UTC (after NYSE close at 4 PM ET = 8 PM UTC, plus buffer)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      full_fetch:
        description: 'Force a full 1-year fetch (ignore incremental mode)'
        required: false
        default: 'false'
        type: boolean

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout for full market fetch
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Configure Git LFS
        run: git lfs install

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Clear manifest for full fetch
        if: github.event.inputs.full_fetch == 'true'
        run: rm -f data/historical/manifest.json

      - name: Fetch historical data
        run: python scripts/fetch-history.py

      - name: Commit and push
        run: |
          git config user.name "Nostradamus Bot"
          git config user.email "bot@nostradamus.app"
          git add data/historical/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          TICKER_COUNT=$(python -c "import json; d=json.load(open('data/historical/manifest.json')); print(d['totalTickers'])")
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "📈 Historical data update [${TODAY}] — ${TICKER_COUNT} tickers"
          git push
