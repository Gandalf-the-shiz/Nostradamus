name: Fetch Stock Data

on:
  schedule:
    - cron: '0 21 * * 1-5'  # Weekdays at 9 PM UTC (after NYSE close)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual data refresh'

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stock data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          node scripts/fetch-historical.js

      - name: Commit and push
        run: |
          git config user.name "Nostradamus Bot"
          git config user.email "bot@nostradamus.app"
          git add data/historical/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "📈 Daily stock data update [$(date -u +%Y-%m-%d)]"
          git push
