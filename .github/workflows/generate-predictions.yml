name: Generate Daily Predictions

on:
  schedule:
    # Run at 22:30 UTC every weekday (after US market close at ~21:00 UTC)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write

jobs:
  generate-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Git LFS
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate predictions
        run: python scripts/generate-predictions.py

      - name: Commit prediction file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/predictions/ || true

          if git diff --cached --quiet; then
            echo "No new predictions to commit."
          else
            git commit -m "chore: generate daily predictions $(date -u +%Y-%m-%d)"
            git push
          fi
