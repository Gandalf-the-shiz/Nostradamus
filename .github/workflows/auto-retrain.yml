name: Auto-Retrain Model

on:
  schedule:
    # Run every Sunday at 4:00 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write

jobs:
  auto-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Git LFS
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check rolling accuracy
        id: accuracy_check
        run: |
          python - <<'EOF'
          import json, sys, os

          log_path = "data/accuracy/accuracy-log.json"
          threshold = 0.53  # Minimum acceptable accuracy (slightly above naive 50% baseline)

          try:
              with open(log_path) as f:
                  data = json.load(f)
              entries = data.get("entries", [])
              if not entries:
                  print("No accuracy entries found. Triggering retraining.")
                  print("NEEDS_RETRAIN=true")
                  sys.exit(0)

              # Check rolling 30-day accuracy
              from datetime import datetime, timedelta, timezone
              cutoff = datetime.now(timezone.utc) - timedelta(days=30)
              recent = [
                  e for e in entries
                  if datetime.fromisoformat(e["date"].replace("Z", "+00:00")) >= cutoff
              ]

              if not recent:
                  print("No recent entries (last 30 days). Triggering retraining.")
                  print("NEEDS_RETRAIN=true")
                  sys.exit(0)

               sample_size = sum(int(e.get("total", 0) or 0) for e in recent if e.get("hitRate") is not None)
               correct = sum(int(e.get("correct", 0) or 0) for e in recent if e.get("hitRate") is not None)
               hit_rate = (correct / sample_size) if sample_size > 0 else 0.0

               print(f"Rolling 30-day hit rate: {hit_rate:.4f} ({correct}/{sample_size})")
              print(f"Threshold: {threshold}")

              if hit_rate < threshold:
                  print(f"Accuracy {hit_rate:.2%} is below threshold {threshold:.2%}. Triggering retraining.")
                  print("NEEDS_RETRAIN=true")
              else:
                  print(f"Model performing adequately ({hit_rate:.2%} >= {threshold:.2%}), skipping retraining.")
                  print("NEEDS_RETRAIN=false")

          except FileNotFoundError:
              print(f"Accuracy log not found at {log_path}. Triggering retraining.")
              print("NEEDS_RETRAIN=true")
          except Exception as e:
              print(f"Error reading accuracy log: {e}. Triggering retraining as a precaution.")
              print("NEEDS_RETRAIN=true")
          EOF
        shell: bash

      - name: Extract retrain flag
        id: set_flag
        run: |
          output=$(python - <<'EOF'
          import json, sys
          from datetime import datetime, timedelta, timezone

          log_path  = "data/accuracy/accuracy-log.json"
          # Minimum acceptable accuracy: slightly above the ~52% naive "always UP" baseline
          threshold = 0.53

          try:
              with open(log_path) as f:
                  data = json.load(f)
              entries = data.get("entries", [])
              if not entries:
                  print("true")
                  sys.exit(0)
              cutoff = datetime.now(timezone.utc) - timedelta(days=30)
              recent = [
                  e for e in entries
                  if datetime.fromisoformat(e["date"].replace("Z", "+00:00")) >= cutoff
              ]
              if not recent:
                  print("true")
                  sys.exit(0)
               sample_size = sum(int(e.get("total", 0) or 0) for e in recent if e.get("hitRate") is not None)
               correct = sum(int(e.get("correct", 0) or 0) for e in recent if e.get("hitRate") is not None)
               hit_rate = (correct / sample_size) if sample_size > 0 else 0.0
               print("true" if hit_rate < threshold else "false")
          except Exception:
              print("true")
          EOF
          )
          echo "needs_retrain=$output" >> "$GITHUB_OUTPUT"

      - name: Back up existing model
        if: steps.set_flag.outputs.needs_retrain == 'true'
        run: |
          if [ -d models/v2 ]; then
            cp -r models/v2 models/v2_backup
            echo "Backed up models/v2 to models/v2_backup"
          else
            echo "No existing model to back up."
          fi

      - name: Run model training
        if: steps.set_flag.outputs.needs_retrain == 'true'
        run: python scripts/train-model.py

      - name: Compare models and promote if better
        if: steps.set_flag.outputs.needs_retrain == 'true'
        run: |
          python - <<'EOF'
          import json, os, shutil, sys
          from datetime import datetime, timezone
          from pathlib import Path

          new_meta_path    = Path("models/v2/metadata.json")
          new_model_path   = Path("models/v2/model.json")
          backup_dir       = Path("models/v2_backup")

          decision = "rolled_back"
          prev_acc = None
          sample_size = None

          if not new_model_path.exists():
              print("No new model found at models/v2/model.json — training may have been skipped.")
              sys.exit(0)

          if not new_meta_path.exists():
              print("New model has no metadata.json — accepting as first version.")
              if backup_dir.exists():
                  shutil.rmtree(backup_dir)
              sys.exit(0)

          with open(new_meta_path) as f:
              new_meta = json.load(f)

          new_acc = float(new_meta.get("testMetrics", {}).get("accuracy", 0.0) or 0.0)
          sample_size = int(new_meta.get("trainingStats", {}).get("testSamples", 0) or 0)
          print(f"New model test accuracy: {new_acc:.4f}")

          # Check if there's a "previous" metadata to compare against
          prev_meta_path = Path("models/v2/metadata_prev.json")
          if prev_meta_path.exists():
              with open(prev_meta_path) as f:
                  prev_meta = json.load(f)
               prev_acc = float(prev_meta.get("testMetrics", {}).get("accuracy", 0.0) or 0.0)
               print(f"Previous model test accuracy: {prev_acc:.4f}")

               if new_acc > prev_acc:
                   print(f"New model is better ({new_acc:.4f} > {prev_acc:.4f}). Promoting.")
                   decision = "promoted"
                   # Save new metadata as the new baseline
                   shutil.copy(new_meta_path, prev_meta_path)
                  # Delete backup — new model is now live
                  if backup_dir.exists():
                      shutil.rmtree(backup_dir)
               else:
                   print(f"New model is not better ({new_acc:.4f} <= {prev_acc:.4f}). Rolling back.")
                   decision = "rolled_back"
                   # Restore previous model weights and metadata from backup
                  if backup_dir.exists():
                      for f in backup_dir.iterdir():
                          shutil.copy(f, Path("models/v2") / f.name)
                      shutil.rmtree(backup_dir)
                      print("Restored previous model weights and metadata from backup.")
                  else:
                      print("No backup found — cannot restore weights.")
           else:
               # First run — save as baseline
               print("No previous model metadata found. Saving current as baseline.")
               decision = "promoted"
               shutil.copy(new_meta_path, prev_meta_path)
               if backup_dir.exists():
                   shutil.rmtree(backup_dir)

           history_path = Path("data/accuracy/retrain-history.json")
           history_path.parent.mkdir(parents=True, exist_ok=True)
           if history_path.exists():
               with open(history_path) as f:
                   hist = json.load(f)
           else:
               hist = {"entries": []}
           hist.setdefault("entries", []).append({
               "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
               "decision": decision,
               "previousAccuracy": prev_acc,
               "newAccuracy": new_acc,
               "sampleSize": sample_size,
           })
           with open(history_path, "w") as f:
               json.dump(hist, f, indent=2)
          EOF

      - name: Commit updated model
        if: steps.set_flag.outputs.needs_retrain == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add models/v2/ models/archive/ data/accuracy/retrain-history.json || true

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "chore: auto-retrain model $(date -u +%Y-%m-%d)"
            git push
          fi
