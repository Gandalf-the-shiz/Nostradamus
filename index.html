<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Nostradamus — ML stock intelligence dashboard" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <title>Nostradamus</title>
  <link rel="stylesheet" href="css/rh-theme.css" />
  <link rel="stylesheet" href="css/investor.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" defer></script>
</head>
<body class="rh-body">
  <div id="rh-app" class="rh-app">
    <header class="rh-topbar" id="rh-topbar">
      <div class="rh-topbar__brand">
        <span class="rh-topbar__logo" aria-hidden="true">N</span>
        <h1 class="rh-topbar__title" id="rh-page-title">Command Center</h1>
      </div>
      <div class="rh-topbar__actions">
        <button type="button" class="rh-btn-icon" id="rh-arch-btn" title="How it works" aria-label="Architecture">i</button>
        <button type="button" class="rh-btn-icon" id="rh-help-btn" title="How this page works" aria-label="Page help">?</button>
      </div>
    </header>
    <main class="rh-main" id="rh-main" role="main">
      <div class="rh-loading">Loading Nostradamus…</div>
    </main>
    <nav class="rh-tabbar" id="rh-tabbar" aria-label="Main navigation">
      <button type="button" class="rh-tab rh-tab--active" data-route="home" aria-current="page">
        <span class="rh-tab__icon" aria-hidden="true">◉</span>
        <span>Command</span>
      </button>
      <button type="button" class="rh-tab" data-route="markets">
        <span class="rh-tab__icon" aria-hidden="true">◎</span>
        <span>Markets</span>
      </button>
      <button type="button" class="rh-tab" data-route="investor">
        <span class="rh-tab__icon" aria-hidden="true">◇</span>
        <span>Investor</span>
      </button>
      <button type="button" class="rh-tab" data-route="trade">
        <span class="rh-tab__icon" aria-hidden="true">↗</span>
        <span>Trade</span>
      </button>
      <button type="button" class="rh-tab" data-route="predictions">
        <span class="rh-tab__icon" aria-hidden="true">⊙</span>
        <span>Predict</span>
      </button>
      <button type="button" class="rh-tab" data-route="chat">
        <span class="rh-tab__icon" aria-hidden="true">◈</span>
        <span>Chat</span>
      </button>
    </nav>
  </div>
  <div id="rh-modal-root"></div>
  <script type="module" src="js/rh-app.js"></script>
</body>
</html>
